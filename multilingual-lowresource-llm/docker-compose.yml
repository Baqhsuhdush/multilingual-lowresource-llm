version: '3.8'

services:
  # Основной API сервис
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-production}
    container_name: multilingual-llm-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - USE_GPU=${USE_GPU:-true}
      - MODEL_PATH=/app/models/finetuned
      - INDEX_PATH=/app/data/faiss_indexes
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - HF_TOKEN=${HF_TOKEN}
      - WANDB_API_KEY=${WANDB_API_KEY}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logs:/app/logs
      - model-cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    command: >
      sh -c "if [ -f /app/models/finetuned/pytorch_model.bin ]; then
               uvicorn src.api.server:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-4};
             else
               echo 'Model not found. Please run training first.' && sleep infinity;
             fi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - llm-network

  # Демо интерфейс
  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    container_name: multilingual-llm-demo
    ports:
      - "${DEMO_PORT:-8501}:8501"
    environment:
      - API_URL=http://api:8000
      - DEMO_THEME=${DEMO_THEME:-light}
    depends_on:
      - api
    volumes:
      - ./demo:/app/demo
    command: streamlit run demo/app.py --server.port 8501 --server.address 0.0.0.0 --theme.base ${DEMO_THEME:-light}
    networks:
      - llm-network

  # Сервис тренировки
  training:
    build:
      context: .
    container_name: multilingual-llm-training
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - TRAIN_BATCH_SIZE=${TRAIN_BATCH_SIZE:-4}
      - LEARNING_RATE=${LEARNING_RATE:-2e-4}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./experiments:/app/experiments
      - model-cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${TRAINING_GPU_COUNT:-1}
              capabilities: [gpu]
    command: python -m src.models.qlora_trainer
    profiles:
      - training
    networks:
      - llm-network

  # Векторная база данных
  vector-db:
    image: qdrant/qdrant:v1.7.4
    container_name: multilingual-llm-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - llm-network

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: multilingual-llm-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - llm-network

  # MLflow для экспериментов
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: multilingual-llm-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      - minio
    networks:
      - llm-network

  # MinIO для хранения артефактов
  minio:
    image: minio/minio:latest
    container_name: multilingual-llm-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - llm-network

  # Prometheus для мониторинга
  prometheus:
    image: prom/prometheus:latest
    container_name: multilingual-llm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - llm-network

  # Grafana для визуализации
  grafana:
    image: grafana/grafana:latest
    container_name: multilingual-llm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - llm-network

  # Nginx для проксирования
  nginx:
    image: nginx:alpine
    container_name: multilingual-llm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - api
      - demo
    networks:
      - llm-network

# Сети
networks:
  llm-network:
    driver: bridge

# Тома
volumes:
  model-cache:
  qdrant_storage:
  redis_data:
  mlflow_data:
  minio_data:
  prometheus_data:
  grafana_data: